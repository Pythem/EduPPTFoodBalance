<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>火眼辨盐·判断对错</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "楷体", sans-serif;
    background: linear-gradient(135deg, #fdf6e3, #f5e6c8);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #5a3a1a;
    overflow-x: hidden;
  }

  .container {
    max-width: 920px;
    width: 100%;
    background: #fffaf0;
    border-radius: 28px;
    border: 4px solid #d4a373;
    padding: 28px 32px 32px;
    box-shadow: 0 12px 40px rgba(139,90,43,0.18);
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  /* 顶部进度条 */
  .top-progress {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 8px;
    background: #f0e0c8;
    border-radius: 28px 28px 0 0;
    overflow: hidden;
  }
  .top-progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #f59e0b, #c41a1a);
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  h1 {
    font-size: 46px;
    color: #c41a1a;
    font-family: "华文行楷", "楷体", serif;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }
  .subtitle { font-size: 22px; color: #8b5a2b; margin-bottom: 22px; }

  /* 状态栏 */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
  }
  .stat-card {
    flex: 1;
    background: #fff3e0;
    border: 2px solid #e8c99b;
    border-radius: 14px;
    padding: 10px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    transition: transform 0.2s;
  }
  .stat-card.pulse { animation: statPulse 0.4s ease; }
  @keyframes statPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .stat-label { font-size: 16px; color: #8b5a2b; font-weight: 600; }
  .stat-value { font-size: 28px; font-weight: bold; color: #c41a1a; line-height: 1; }
  .stat-card.combo .stat-value { color: #e65100; }

  /* 计时条 */
  .timer-bar {
    width: 100%;
    height: 12px;
    background: #f0e0c8;
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .timer-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #4caf50, #8bc34a);
    border-radius: 6px;
    transition: width 0.1s linear, background 0.3s;
  }
  .timer-fill.warning { background: linear-gradient(90deg, #ff9800, #f44336); }
  .timer-fill.danger { background: linear-gradient(90deg, #f44336, #b71c1c); animation: dangerBlink 0.4s infinite alternate; }
  @keyframes dangerBlink {
    0% { opacity: 1; }
    100% { opacity: 0.6; }
  }

  /* 题目卡片 */
  .question-box {
    background: linear-gradient(145deg, #fff8ec, #ffefd5);
    border-radius: 20px;
    padding: 40px 28px;
    margin-bottom: 24px;
    min-height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3px solid #e8c99b;
    position: relative;
    box-shadow: inset 0 2px 8px rgba(212,163,115,0.15);
    transition: transform 0.3s, border-color 0.3s;
  }
  .question-box.correct-flash {
    animation: correctFlash 0.5s ease;
    border-color: #4caf50;
  }
  .question-box.wrong-flash {
    animation: wrongFlash 0.5s ease;
    border-color: #f44336;
  }
  @keyframes correctFlash {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); box-shadow: 0 0 30px rgba(76,175,80,0.5); }
  }
  @keyframes wrongFlash {
    0%, 100% { transform: scale(1); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  .question-num {
    font-size: 26px;
    color: #b87333;
    margin-bottom: 14px;
    font-weight: bold;
  }
  .question-text {
    font-size: 50px;
    font-weight: bold;
    color: #5a3a1a;
    line-height: 1.45;
  }

  /* 按钮 */
  .btn-group { display: flex; gap: 20px; justify-content: center; }
  .btn {
    font-size: 38px;
    font-weight: bold;
    padding: 18px 56px;
    border: none;
    border-radius: 60px;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .btn-true { background: linear-gradient(145deg, #4caf50, #2e7d32); box-shadow: 0 5px 0 #1b5e20, 0 8px 16px rgba(0,0,0,0.15); }
  .btn-false { background: linear-gradient(145deg, #f44336, #b71c1c); box-shadow: 0 5px 0 #7f0000, 0 8px 16px rgba(0,0,0,0.15); }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #1b5e20, 0 2px 8px rgba(0,0,0,0.15); }
  .btn-false:active { box-shadow: 0 1px 0 #7f0000, 0 2px 8px rgba(0,0,0,0.15); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* 反馈 */
  .feedback {
    font-size: 30px;
    font-weight: bold;
    margin-top: 20px;
    min-height: 44px;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .feedback.correct { color: #2e7d32; animation: popIn 0.3s ease; }
  .feedback.wrong { color: #b71c1c; animation: popIn 0.3s ease; }
  @keyframes popIn {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* 解释弹层 */
  .explain {
    font-size: 20px;
    color: #6d4c41;
    margin-top: 10px;
    min-height: 26px;
    line-height: 1.5;
    opacity: 0;
    transition: opacity 0.4s;
  }
  .explain.show { opacity: 1; }

  /* 重新开始 */
  .restart-btn {
    display: block;
    margin: 26px auto 0;
    padding: 14px 48px;
    font-size: 24px;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(145deg, #c41a1a, #8b0000);
    border: none;
    border-radius: 40px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(196,26,26,0.35);
    transition: all 0.2s;
  }
  .restart-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(196,26,26,0.45); }

  /* 结果卡片 */
  .result-card {
    padding: 30px 20px;
    animation: popIn 0.5s ease;
  }
  .result-emoji { font-size: 80px; margin-bottom: 12px; display: block; }
  .result-title { font-size: 42px; color: #c41a1a; font-weight: bold; margin-bottom: 16px; }
  .result-line { font-size: 26px; color: #5a3a1a; margin-bottom: 8px; line-height: 1.6; }
  .result-score { font-size: 56px; color: #e65100; font-weight: bold; margin: 16px 0; }

  /* 飘字特效 */
  .float-text {
    position: fixed;
    font-size: 40px;
    font-weight: bold;
    pointer-events: none;
    z-index: 999;
    animation: floatUp 1s ease-out forwards;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
  }

  /* 彩带 */
  .confetti {
    position: fixed;
    width: 10px; height: 10px;
    pointer-events: none;
    z-index: 998;
    animation: confettiFall 2s linear forwards;
  }
  @keyframes confettiFall {
    0% { opacity: 1; transform: translateY(0) rotate(0); }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="container" id="gameContainer">
  <div class="top-progress"><div class="top-progress-fill" id="topProgress"></div></div>

  <h1>🔍 火眼辨盐</h1>
  <p class="subtitle">武平美食小侦探 · 找出高盐陷阱</p>

  <!-- 状态栏 -->
  <div class="status-bar">
    <div class="stat-card" id="scoreCard">
      <span class="stat-label">✅ 得分</span>
      <span class="stat-value" id="scoreValue">0</span>
    </div>
    <div class="stat-card" id="correctCard">
      <span class="stat-label">🎯 答对</span>
      <span class="stat-value" id="correctCount">0</span>
    </div>
    <div class="stat-card combo" id="comboCard">
      <span class="stat-label">🔥 连击</span>
      <span class="stat-value" id="comboCount">0</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">📋 剩余</span>
      <span class="stat-value" id="remainCount">6</span>
    </div>
  </div>

  <!-- 计时条 -->
  <div class="timer-bar">
    <div class="timer-fill" id="timerFill"></div>
  </div>

  <!-- 题目卡片 -->
  <div class="question-box" id="questionBox">
    <div>
      <div class="question-num" id="questionNum">第 1 / 6 题</div>
      <div class="question-text" id="questionText">题目加载中...</div>
    </div>
  </div>

  <!-- 按钮 -->
  <div class="btn-group" id="btnGroup">
    <button class="btn btn-true" onclick="answer(true)">✔ 对</button>
    <button class="btn btn-false" onclick="answer(false)">✘ 错</button>
  </div>

  <!-- 反馈 -->
  <div class="feedback" id="feedback"></div>
  <div class="explain" id="explain"></div>

  <!-- 重新开始 -->
  <button class="restart-btn" onclick="restartGame()">🔄 重新挑战</button>
</div>

<script>
  /* ============ 完整题库（15道） ============ */
  const ALL_QUESTIONS = [
    { text: "辣条是低盐食品", answer: false, explain: "一包辣条的含盐量可达 3～5 克，接近一天的推荐量！" },
    { text: "话梅吃起来甜，所以不含盐", answer: false, explain: "话梅是「隐形盐大户」，10 颗话梅约含 3 克盐。" },
    { text: "水煮玉米是低盐食品", answer: true, explain: "新鲜玉米天然低钠，水煮不加盐就是健康零食。" },
    { text: "清蒸象洞鸡比咸菜腊肉更健康", answer: true, explain: "清蒸保留原味，腊肉咸菜含盐量高，是真正的「盐值刺客」。" },
    { text: "方便面酱包可以全部挤进去", answer: false, explain: "整包酱包含盐约 5～6 克，建议只放三分之一。" },
    { text: "每天吃盐不超过5克", answer: true, explain: "《中国居民膳食指南》推荐：成人每日食盐不超过 5 克。" },
    { text: "酱油是咸的，所以做菜放了酱油就不用放盐了", answer: false, explain: "酱油本身含大量盐，放了酱油要相应减少食盐。" },
    { text: "甜面包、饼干里其实也含盐", answer: true, explain: "很多甜味加工食品都添加了盐，看配料表就能发现。" },
    { text: "低钠盐可以随便吃，不会超标", answer: false, explain: "低钠盐用钾代替部分钠，肾功能不好的人不能随便吃。" },
    { text: "看食品标签时，钠含量乘以2.5就是盐含量", answer: true, explain: "1 克钠约等于 2.5 克盐，这是换算小技巧。" },
    { text: "儿童和成人一样，每天不超过5克盐", answer: false, explain: "儿童年龄越小推荐量越低，1～3岁不超过2克，4～6岁不超过3克。" },
    { text: "运动出汗后喝淡盐水比喝白开水更补盐", answer: true, explain: "大量出汗后适量补充淡盐水有助恢复，但日常不需要。" },
    { text: "多吃盐可以增强体力", answer: false, explain: "盐吃多了反而增加身体负担，不会增强体力。" },
    { text: "做菜时用醋、柠檬汁可以替代部分盐调味", answer: true, explain: "酸味能提升咸味感知，帮助减少用盐。" },
    { text: "咸菜、腊肉、香肠都是高盐食物", answer: true, explain: "这些腌制加工肉制品含盐量非常高，要少吃。" }
  ];

  const PICK_COUNT = 6;        // 每轮随机抽取的题目数量
  const TIME_LIMIT = 12;       // 每题限时（秒）
  const BASE_SCORE = 100;      // 基础分
  const COMBO_BONUS = 30;      // 连击额外分

  let questions = [];          // 本轮抽取的题目
  let current = 0;
  let score = 0;
  let correctCount = 0;
  let combo = 0;
  let maxCombo = 0;
  let timeLeft = TIME_LIMIT;
  let timerId = null;
  let locked = false;
  let isPlaying = false;

  /* ============ 随机抽题 ============ */
  function pickQuestions(n) {
    const shuffled = [...ALL_QUESTIONS].sort(() => Math.random() - 0.5);
    return shuffled.slice(0, n);
  }

  const els = {
    topProgress: document.getElementById('topProgress'),
    scoreValue: document.getElementById('scoreValue'),
    correctCount: document.getElementById('correctCount'),
    comboCount: document.getElementById('comboCount'),
    remainCount: document.getElementById('remainCount'),
    timerFill: document.getElementById('timerFill'),
    questionBox: document.getElementById('questionBox'),
    questionNum: document.getElementById('questionNum'),
    questionText: document.getElementById('questionText'),
    btnGroup: document.getElementById('btnGroup'),
    feedback: document.getElementById('feedback'),
    explain: document.getElementById('explain'),
    scoreCard: document.getElementById('scoreCard'),
    correctCard: document.getElementById('correctCard'),
    comboCard: document.getElementById('comboCard')
  };

  /* ============ 音效（Web Audio 合成，无需外部文件） ============ */
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function playTone(freq, duration, type = 'sine', volume = 0.15) {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  }
  function sfxCorrect() {
    playTone(880, 0.12, 'sine');
    setTimeout(() => playTone(1320, 0.18, 'sine'), 100);
  }
  function sfxWrong() {
    playTone(220, 0.25, 'sawtooth', 0.1);
    setTimeout(() => playTone(180, 0.3, 'sawtooth', 0.08), 150);
  }
  function sfxTick() { playTone(1200, 0.04, 'square', 0.04); }
  function sfxFinish() {
    [523, 659, 784, 1047].forEach((f, i) => {
      setTimeout(() => playTone(f, 0.2, 'sine', 0.12), i * 120);
    });
  }

  /* ============ 渲染题目 ============ */
  function renderQuestion() {
    if (current >= questions.length) {
      finishGame();
      return;
    }
    locked = false;
    const q = questions[current];
    els.questionText.textContent = q.text;
    els.questionNum.textContent = `第 ${current + 1} / ${questions.length} 题`;
    els.feedback.textContent = '';
    els.feedback.className = 'feedback';
    els.explain.textContent = '';
    els.explain.className = 'explain';
    els.remainCount.textContent = questions.length - current;
    els.topProgress.style.width = (current / questions.length) * 100 + '%';

    // 恢复按钮
    els.btnGroup.querySelectorAll('.btn').forEach(b => b.disabled = false);
    els.btnGroup.style.display = 'flex';

    // 重置题目卡片样式
    els.questionBox.classList.remove('correct-flash', 'wrong-flash');

    // 开始计时
    startTimer();
  }

  /* ============ 计时器 ============ */
  function startTimer() {
    clearInterval(timerId);
    timeLeft = TIME_LIMIT;
    updateTimerUI();
    isPlaying = true;
    let lastTick = Math.ceil(timeLeft);
    timerId = setInterval(() => {
      timeLeft -= 0.1;
      if (timeLeft <= 0) {
        timeLeft = 0;
        updateTimerUI();
        clearInterval(timerId);
        timeUp();
        return;
      }
      updateTimerUI();
      const nowTick = Math.ceil(timeLeft);
      if (nowTick !== lastTick) {
        lastTick = nowTick;
        if (nowTick <= 3) sfxTick();
      }
    }, 100);
  }

  function updateTimerUI() {
    const pct = (timeLeft / TIME_LIMIT) * 100;
    els.timerFill.style.width = pct + '%';
    els.timerFill.classList.remove('warning', 'danger');
    if (timeLeft <= 3) els.timerFill.classList.add('danger');
    else if (timeLeft <= 6) els.timerFill.classList.add('warning');
  }

  function stopTimer() {
    clearInterval(timerId);
    isPlaying = false;
  }

  /* ============ 超时处理 ============ */
  function timeUp() {
    if (locked) return;
    locked = true;
    combo = 0;
    els.comboCount.textContent = 0;
    els.feedback.innerHTML = '⏰ 时间到！';
    els.feedback.className = 'feedback wrong';
    els.explain.textContent = questions[current].explain;
    els.explain.className = 'explain show';
    els.btnGroup.querySelectorAll('.btn').forEach(b => b.disabled = true);
    flashCard('wrong');
    sfxWrong();
    current++;
    setTimeout(renderQuestion, 2200);
  }

  /* ============ 答题 ============ */
  function answer(choice) {
    if (locked || current >= questions.length) return;
    locked = true;
    stopTimer();

    const q = questions[current];
    const fb = els.feedback;

    if (choice === q.answer) {
      // 答对
      correctCount++;
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      const timeBonus = Math.round(timeLeft * 5);
      const comboBonus = (combo - 1) * COMBO_BONUS;
      const gained = BASE_SCORE + timeBonus + comboBonus;
      score += gained;

      els.correctCount.textContent = correctCount;
      els.comboCount.textContent = combo;
      els.scoreValue.textContent = score;

      fb.innerHTML = `✅ 答对啦！ <span style="color:#e65100; font-size:26px;">+${gained}</span>`;
      if (combo >= 2) fb.innerHTML += ` <span style="color:#e65100; font-size:22px;">🔥 ${combo}连击</span>`;
      fb.className = 'feedback correct';

      flashCard('correct');
      sfxCorrect();
      floatScore(`+${gained}`, combo >= 2 ? '#e65100' : '#2e7d32');

      // 卡片脉冲
      pulseCard(els.scoreCard);
      if (combo >= 2) pulseCard(els.comboCard);
      pulseCard(els.correctCard);
    } else {
      // 答错
      combo = 0;
      els.comboCount.textContent = 0;
      fb.innerHTML = `❌ 再想想～正确答案是 <span style="color:#2e7d32;">${q.answer ? '✔ 对' : '✘ 错'}</span>`;
      fb.className = 'feedback wrong';
      flashCard('wrong');
      sfxWrong();
    }

    // 显示解释
    els.explain.textContent = '💡 ' + q.explain;
    els.explain.className = 'explain show';

    els.btnGroup.querySelectorAll('.btn').forEach(b => b.disabled = true);
    current++;
    setTimeout(renderQuestion, 2400);
  }

  /* ============ 视觉反馈 ============ */
  function flashCard(type) {
    els.questionBox.classList.remove('correct-flash', 'wrong-flash');
    void els.questionBox.offsetWidth; // 重排以重启动画
    els.questionBox.classList.add(type === 'correct' ? 'correct-flash' : 'wrong-flash');
  }

  function pulseCard(card) {
    card.classList.remove('pulse');
    void card.offsetWidth;
    card.classList.add('pulse');
  }

  function floatScore(text, color) {
    const el = document.createElement('div');
    el.className = 'float-text';
    el.textContent = text;
    el.style.color = color;
    el.style.left = '50%';
    el.style.top = '40%';
    el.style.transform = 'translateX(-50%)';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }

  function spawnConfetti() {
    const colors = ['#f44336', '#4caf50', '#ff9800', '#2196f3', '#9c27b0', '#ffeb3b'];
    for (let i = 0; i < 60; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.left = Math.random() * 100 + 'vw';
      c.style.top = '-20px';
      c.style.animationDelay = Math.random() * 0.8 + 's';
      c.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3500);
    }
  }

  /* ============ 结束 ============ */
  function finishGame() {
    stopTimer();
    els.topProgress.style.width = '100%';
    els.btnGroup.style.display = 'none';
    els.timerFill.style.width = '0%';
    els.remainCount.textContent = 0;

    const total = questions.length;
    const rate = Math.round((correctCount / total) * 100);
    let emoji, title;
    if (rate === 100) { emoji = '🏆'; title = '盐值侦探·大师级！'; }
    else if (rate >= 80) { emoji = '🎉'; title = '盐值侦探·高手！'; }
    else if (rate >= 60) { emoji = '👍'; title = '盐值侦探·入门！'; }
    else { emoji = '💪'; title = '继续加油，再挑战！'; }

    els.questionBox.innerHTML = `
      <div class="result-card">
        <span class="result-emoji">${emoji}</span>
        <div class="result-title">${title}</div>
        <div class="result-score">${score} 分</div>
        <div class="result-line">答对 ${correctCount} / ${total} 题 · 最高连击 ${maxCombo}</div>
        <div class="result-line" style="font-size:22px; color:#8b5a2b; margin-top:10px;">
          ${rate >= 80 ? '你已经能识破大部分高盐陷阱啦！' : '记住：每天食盐不超过 5 克哦～'}
        </div>
      </div>
    `;
    els.feedback.textContent = '';
    els.feedback.className = 'feedback';
    els.explain.textContent = '';
    els.explain.className = 'explain';

    sfxFinish();
    if (rate >= 80) spawnConfetti();
  }

  /* ============ 重新开始（重新随机抽题） ============ */
  function restartGame() {
    stopTimer();
    questions = pickQuestions(PICK_COUNT);   // 重新抽题
    current = 0;
    score = 0;
    correctCount = 0;
    combo = 0;
    maxCombo = 0;
    locked = false;

    els.scoreValue.textContent = 0;
    els.correctCount.textContent = 0;
    els.comboCount.textContent = 0;
    els.remainCount.textContent = questions.length;
    els.topProgress.style.width = '0%';
    els.timerFill.style.width = '100%';
    els.timerFill.classList.remove('warning', 'danger');

    // 还原题目框结构
    els.questionBox.innerHTML = `
      <div>
        <div class="question-num" id="questionNum">第 1 / ${questions.length} 题</div>
        <div class="question-text" id="questionText">题目加载中...</div>
      </div>
    `;
    els.questionNum = document.getElementById('questionNum');
    els.questionText = document.getElementById('questionText');

    els.btnGroup.style.display = 'flex';
    renderQuestion();
  }

  /* ============ 启动 ============ */
  function initGame() {
    questions = pickQuestions(PICK_COUNT);   // 首次随机抽题
    current = 0;
    score = 0;
    correctCount = 0;
    combo = 0;
    maxCombo = 0;
    locked = false;

    els.scoreValue.textContent = 0;
    els.correctCount.textContent = 0;
    els.comboCount.textContent = 0;
    els.remainCount.textContent = questions.length;
    els.topProgress.style.width = '0%';
    els.timerFill.style.width = '100%';
    els.timerFill.classList.remove('warning', 'danger');

    els.questionBox.innerHTML = `
      <div>
        <div class="question-num" id="questionNum">第 1 / ${questions.length} 题</div>
        <div class="question-text" id="questionText">题目加载中...</div>
      </div>
    `;
    els.questionNum = document.getElementById('questionNum');
    els.questionText = document.getElementById('questionText');

    els.btnGroup.style.display = 'flex';
    renderQuestion();
  }

  initGame();
</script>
</body>
</html>
